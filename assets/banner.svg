<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#070a10"/></linearGradient><linearGradient id="accentCyan" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="accentPurple" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="glowPulse" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".8"/><stop offset="50%" stop-color="#a855f7" stop-opacity=".9"/><stop offset="100%" stop-color="#ec4899" stop-opacity=".8"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="glow-soft" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="16"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".4" stroke-width=".8" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity=".2"/></pattern></defs><style>@keyframes pulseGlow{0%{opacity:.25;transform:scale(1)}50%{opacity:.55;transform:scale(1.08)}}@keyframes floatOrb1{0%{transform:translate(0,0)}50%{transform:translate(30px,-20px)}}@keyframes floatOrb2{0%{transform:translate(0,0)}50%{transform:translate(-25px,25px)}}@keyframes nodeBlink{0%{r:5;opacity:.8}50%{r:8;opacity:1}}.orb1{animation:floatOrb1 9s ease-in-out infinite,pulseGlow 6s ease-in-out infinite;transform-origin:200px 100px}.orb2{animation:floatOrb2 11s ease-in-out infinite,pulseGlow 7s ease-in-out infinite;transform-origin:1000px 300px}.data-edge{stroke-dasharray:6,8;animation:dashCycle 6s linear infinite}.data-edge-rev{stroke-dasharray:5,7;animation:dashCycle 8s linear infinite reverse}.node-pulse-1{animation:nodeBlink 3s ease-in-out infinite}.node-pulse-2{animation:nodeBlink 4s ease-in-out infinite 1.5s}.node-pulse-3{animation:nodeBlink 3.5s ease-in-out infinite .7s}.badge-pill{transition:transform .3s ease}.badge-pill:hover{transform:translateY(-3px)}.title-text{font-weight:800;letter-spacing:-.8px}.sub-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}</style><rect width="1200" height="420" fill="url(#bgGradient)" rx="16"/><rect width="1200" height="420" fill="url(#gridPattern)" rx="16"/><g filter="url(#glow-soft)"><circle cx="160" cy="90" r="120" fill="#38bdf8" class="orb1" opacity=".18"/><circle cx="1040" cy="330" r="140" fill="#a855f7" class="orb2" opacity=".22"/><circle cx="980" cy="80" r="90" fill="#06b6d4" class="orb1" opacity=".14"/><circle cx="180" cy="340" r="110" fill="#ec4899" class="orb2" opacity=".12"/></g><g opacity=".45"><path fill="none" stroke="#0ea5e9" stroke-width="1.6" d="M 80,180 Q 240,70 380,110 T 700,90 T 1000,160 T 1120,240" class="data-edge"/><path fill="none" stroke="#a855f7" stroke-width="1.6" d="M 120,300 Q 300,360 480,290 T 820,330 T 1100,280" class="data-edge-rev"/><path fill="none" stroke="#6366f1" stroke-opacity=".7" stroke-width="1.2" d="M 160,110 L 250,220 L 390,160 L 520,260 L 680,140 L 840,240 L 960,130 L 1080,210" class="data-edge"/><path fill="none" stroke="#ec4899" stroke-opacity=".6" stroke-width="1.2" d="M 250,220 L 320,330 L 540,340 L 760,280 L 890,360" class="data-edge-rev"/><circle cx="80" cy="180" r="5" fill="#38bdf8" class="node-pulse-1"/><circle cx="250" cy="220" r="6" fill="#818cf8" class="node-pulse-2"/><circle cx="390" cy="160" r="5" fill="#c084fc" class="node-pulse-3"/><circle cx="520" cy="260" r="6" fill="#38bdf8" class="node-pulse-1"/><circle cx="680" cy="140" r="5" fill="#a855f7" class="node-pulse-2"/><circle cx="840" cy="240" r="6" fill="#f472b6" class="node-pulse-3"/><circle cx="960" cy="130" r="5" fill="#38bdf8" class="node-pulse-1"/><circle cx="1080" cy="210" r="6" fill="#818cf8" class="node-pulse-2"/><circle cx="320" cy="330" r="5" fill="#06b6d4" class="node-pulse-3"/><circle cx="760" cy="280" r="6" fill="#c084fc" class="node-pulse-1"/></g><rect width="1060" height="330" x="70" y="45" fill="#090d16" fill-opacity=".78" stroke="#1e293b" stroke-width="1.2" filter="url(#glow)" rx="14"/><g id="foreground-content"><g transform="translate(425, 72)"><rect width="350" height="28" x="0" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="14"/><circle cx="15" cy="14" r="5" fill="#10b981"/><text x="32" y="18" fill="#94a3b8" class="sub-text" font-size="11.5" font-weight="600" letter-spacing="1">CURATED DEVELOPER DIRECTORY • 2026</text></g><text x="600" y="152" fill="#fff" class="title-text" filter="url(#glow)" font-size="38" text-anchor="middle">Awesome Code Knowledge Graph</text><text x="600" y="196" fill="url(#glowPulse)" class="title-text" font-size="32" text-anchor="middle">&amp; Static Analysis Ecosystem</text><text x="600" y="242" fill="#94a3b8" class="sub-text" font-size="15" font-weight="400" text-anchor="middle">Semantic Code Graphs • AST/CPG Call-Graph Indexing • Code Search • SAST &amp; Architecture Linting</text><g><g class="badge-pill" transform="translate(140, 276) translate(0, 0)"><rect width="195" height="42" fill="#111827" stroke="#0ea5e9" stroke-width="1.2" rx="10"/><circle cx="22" cy="21" r="5" fill="#0ea5e9"/><text x="36" y="22" fill="#f8fafc" class="sub-text" dominant-baseline="middle" font-size="12.5" font-weight="600">Knowledge Graphs</text></g><g class="badge-pill" transform="translate(140, 276) translate(210, 0)"><rect width="215" height="42" fill="#111827" stroke="#8b5cf6" stroke-width="1.2" rx="10"/><circle cx="22" cy="21" r="5" 