<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="glowPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.2" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.08); }
    }
    @keyframes floatOrb1 {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(30px, -20px); }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(-25px, 25px); }
    }
    @keyframes dashCycle {
      to { stroke-dashoffset: -120; }
    }
    @keyframes nodeBlink {
      0%, 100% { r: 5; opacity: 0.8; }
      50% { r: 8; opacity: 1; }
    }
    .orb1 { animation: floatOrb1 9s ease-in-out infinite, pulseGlow 6s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb2 { animation: floatOrb2 11s ease-in-out infinite, pulseGlow 7s ease-in-out infinite; transform-origin: 1000px 300px; }
    .data-edge { stroke-dasharray: 6, 8; animation: dashCycle 6s linear infinite; }
    .data-edge-rev { stroke-dasharray: 5, 7; animation: dashCycle 8s linear infinite reverse; }
    .node-pulse-1 { animation: nodeBlink 3s ease-in-out infinite; }
    .node-pulse-2 { animation: nodeBlink 4s ease-in-out infinite 1.5s; }
    .node-pulse-3 { animation: nodeBlink 3.5s ease-in-out infinite 0.7s; }
    .badge-pill { transition: transform 0.3s ease; }
    .badge-pill:hover { transform: translateY(-3px); }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; letter-spacing: -0.8px; }
    .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Deep Background Layer -->
  <rect width="1200" height="420" fill="url(#bgGradient)" rx="16" />
  <rect width="1200" height="420" fill="url(#gridPattern)" rx="16" />

  <!-- Animated Ambient Nebula Orbs (Positioned safely behind edges and corners) -->
  <g filter="url(#glow-soft)">
    <circle class="orb1" cx="160" cy="90" r="120" fill="#38bdf8" opacity="0.18" />
    <circle class="orb2" cx="1040" cy="330" r="140" fill="#a855f7" opacity="0.22" />
    <circle class="orb1" cx="980" cy="80" r="90" fill="#06b6d4" opacity="0.14" />
    <circle class="orb2" cx="180" cy="340" r="110" fill="#ec4899" opacity="0.12" />
  </g>

  <!-- Interactive Dynamic Background Knowledge Graph / Network Astrolabe (Subtle background) -->
  <g opacity="0.45">
    <!-- Graph Edges / Call Hierarchy lines -->
    <path class="data-edge" d="M 80,180 Q 240,70 380,110 T 700,90 T 1000,160 T 1120,240" fill="none" stroke="#0ea5e9" stroke-width="1.6" />
    <path class="data-edge-rev" d="M 120,300 Q 300,360 480,290 T 820,330 T 1100,280" fill="none" stroke="#a855f7" stroke-width="1.6" />
    <path class="data-edge" d="M 160,110 L 250,220 L 390,160 L 520,260 L 680,140 L 840,240 L 960,130 L 1080,210" fill="none" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.7" />
    <path class="data-edge-rev" d="M 250,220 L 320,330 L 540,340 L 760,280 L 890,360" fill="none" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.6" />

    <!-- Static Analysis / Knowledge Graph Graph Nodes -->
    <circle class="node-pulse-1" cx="80" cy="180" r="5" fill="#38bdf8" />
    <circle class="node-pulse-2" cx="250" cy="220" r="6" fill="#818cf8" />
    <circle class="node-pulse-3" cx="390" cy="160" r="5" fill="#c084fc" />
    <circle class="node-pulse-1" cx="520" cy="260" r="6" fill="#38bdf8" />
    <circle class="node-pulse-2" cx="680" cy="140" r="5" fill="#a855f7" />
    <circle class="node-pulse-3" cx="840" cy="240" r="6" fill="#f472b6" />
    <circle class="node-pulse-1" cx="960" cy="130" r="5" fill="#38bdf8" />
    <circle class="node-pulse-2" cx="1080" cy="210" r="6" fill="#818cf8" />
    <circle class="node-pulse-3" cx="320" cy="330" r="5" fill="#06b6d4" />
    <circle class="node-pulse-1" cx="760" cy="280" r="6" fill="#c084fc" />
  </g>

  <!-- Foreground Shield Card (Semi-transparent backdrop to guarantee 100% crisp foreground text legibility) -->
  <rect x="70" y="45" width="1060" height="330" rx="14" fill="#090d16" fill-opacity="0.78" stroke="#1e293b" stroke-width="1.2" filter="url(#glow)" />

  <!-- Content Group (Strictly in foreground) -->
  <g id="foreground-content">
    <!-- Top Pill / Status Tag -->
    <g transform="translate(425, 72)">
      <rect x="0" y="0" width="350" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="15" cy="14" r="5" fill="#10b981" />
      <text x="32" y="18" fill="#94a3b8" font-size="11.5" class="sub-text" font-weight="600" letter-spacing="1">CURATED DEVELOPER DIRECTORY &bull; 2026</text>
    </g>

    <!-- Main Title with Gradient Glow -->
    <text x="600" y="152" text-anchor="middle" fill="#ffffff" font-size="38" class="title-text" filter="url(#glow)">
      Awesome Code Knowledge Graph
    </text>
    <text x="600" y="196" text-anchor="middle" fill="url(#glowPulse)" font-size="32" class="title-text">
      &amp; Static Analysis Ecosystem
    </text>

    <!-- High Impact Tagline -->
    <text x="600" y="242" text-anchor="middle" fill="#94a3b8" font-size="15" class="sub-text" font-weight="400">
      Semantic Code Graphs &bull; AST/CPG Call-Graph Indexing &bull; Code Search &bull; SAST &amp; Architecture Linting
    </text>

    <!-- Category Feature Pills Bar -->
    <g transform="translate(140, 276)">
      <!-- Pill 1 -->
      <g class="badge-pill" transform="translate(0, 0)">
        <rect width="195" height="42" rx="10" fill="#111827" stroke="#0ea5e9" stroke-width="1.2" />
        <circle cx="22" cy="21" r="5" fill="#0ea5e9" />
        <text x="36" y="22" fill="#f8fafc" font-size="12.5" class="sub-text" font-weight="600" dominant-baseline="middle">Knowledge Graphs</text>
      </g>

      <!-- Pill 2 -->
      <g class="badge-pill" transform="translate(210, 0)">
        <rect width="215" height="42" rx="10" fill="#111827" stroke="#8b5cf6" stroke-width="1.2" />
        <circle cx="22" cy="21" r="5" fill="#8b5cf6" />
        <text x="36" y="22" fill="#f8fafc" font-size="12.5" class="sub-text" font-weight="600" dominant-baseline="middle">Static Analysis (SAST)</text>
      </g>

      <!-- Pill 3 -->
      <g class="badge-pill" transform="translate(440, 0)">
        <rect width="225" height="42" rx="10" fill="#111827" stroke="#ec4899" stroke-width="1.2" />
        <circle cx="22" cy="21" r="5" fill="#ec4899" />
        <text x="36" y="22" fill="#f8fafc" font-size="12.5" class="sub-text" font-weight="600" dominant-baseline="middle">Code Property Graphs</text>
      </g>

      <!-- Pill 4 -->
      <g class="badge-pill" transform="translate(680, 0)">
        <rect width="235" height="42" rx="10" fill="#111827" stroke="#10b981" stroke-width="1.2" />
        <circle cx="22" cy="21" r="5" fill="#10b981" />
        <text x="36" y="22" fill="#f8fafc" font-size="12.5" class="sub-text" font-weight="600" dominant-baseline="middle">AI Agent Context &amp; RAG</text>
      </g>
    </g>

    <!-- Bottom Accent Border Line -->
    <rect x="70" y="372" width="1060" height="3" fill="url(#glowPulse)" />
  </g>
</svg>